# ---------------------------------------------------------------
# Configuracion de RegistroPlataforma - Backend (Parte 1)
# ---------------------------------------------------------------
spring.application.name=registroplataforma-backend
server.port=8080

# Base de datos H2 en archivo: los datos se conservan al reiniciar (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/plataforma;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate crea y actualiza las tablas solo a partir de las clases del paquete modelo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Respuestas de error con mensaje y fechas en formato ISO (2026-12-31T23:59:00)
server.error.include-message=always
spring.jackson.serialization.write-dates-as-timestamps=false

# Documentacion interactiva: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# ---------------------------------------------------------------
# Para usar MySQL o PostgreSQL en lugar de H2 solo se cambian
# las propiedades spring.datasource.* y se agrega su driver al pom.xml
# ---------------------------------------------------------------
